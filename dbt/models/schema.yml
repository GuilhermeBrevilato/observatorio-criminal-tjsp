version: 2
models:
  - name: stg_processos
    description: "Metadados por documento, preservando identificador de origem e a data original."
    columns:
      - name: document_id
        data_tests: [not_null, unique]
  - name: fct_processos
    description: "Registros da amostra com data e classe válidas; não deduplicados por número CNJ."
    columns:
      - name: document_id
        data_tests: [not_null, unique]
      - name: classe_codigo
        data_tests: [not_null]
      - name: data_ajuizamento
        data_tests: [not_null]
  - name: fct_assuntos
    description: "Relação 1:N dos assuntos por documento."
  - name: agg_ajuizamentos_mensais
    description: "Contagem mensal APENAS da amostra extraída."
  - name: qa_cobertura
    description: "Cobertura e motivos de exclusão: total, incluídos e campos ausentes ou inválidos."
    columns:
      - name: indicador
        data_tests: [not_null, unique]
  - name: fct_movimentos
    description: "Um movimento por linha, com categoria (mapa_movimentos) e data validada."
    columns:
      - name: document_id
        data_tests: [not_null]
  - name: fct_desfecho_flagrante
    description: "Um flagrante (classe 280) por linha, com a PRIMEIRA decisão sobre a prisão e o tempo até ela."
    columns:
      - name: document_id
        data_tests: [not_null, unique]
      - name: primeira_decisao
        data_tests:
          - accepted_values:
              values: ['liberdade_provisoria', 'preventiva', 'relaxamento', 'nao_homologacao', 'domiciliar']
  - name: qa_desfecho
    description: "Cobertura do desfecho: quantos flagrantes têm a decisão identificável e por quê os demais não."
    columns:
      - name: indicador
        data_tests: [not_null, unique]
  - name: rpt_desfecho_mensal
    description: "Por mês de ajuizamento: volume, desfechos e mediana de tempo. % de desfecho sobre identificáveis."
    columns:
      - name: mes_ajuizamento
        data_tests: [unique]
  - name: rpt_tempo_faixas
    description: "Faixas de tempo da entrada no TJSP até a primeira decisão, por tipo de decisão."
  - name: rpt_desfecho_orgao
    description: "Por órgão julgador; use amostra_suficiente para filtrar percentuais instáveis."
